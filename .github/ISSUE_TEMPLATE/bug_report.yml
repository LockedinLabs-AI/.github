name: Bug report
description: Report reproducible behavior using a synthetic example.
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, follow the repository security policy. Keep private data and credentials out of this public issue."
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: Include the release or commit and the relevant runtime or browser.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use the smallest synthetic example that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Remove credentials, personal paths, and private records from any logs or screenshots.
